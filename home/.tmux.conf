set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,alacritty:RGB"
set -g focus-events on
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# tmux on a server over ssh (nested in the laptop's tmux): prefix C-b,
# so C-a drives the outer tmux and C-b the inner one; status bar on top,
# so the two bars don't stack at the bottom
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g prefix C-b
  unbind C-a
  bind-key C-b send-prefix
  set -g status-position top
}

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

bind -r m resize-pane -Z

# vim-style pane resize (repeatable after the prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g mouse on

# copies reach the laptop clipboard via OSC 52, no xclip: works over ssh and
# through a nested tmux (the outer one forwards it, set-clipboard on)
set -s set-clipboard on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel # copy text with "y"
bind P paste-buffer

unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# minimal theme: transparent status bar, terminal ANSI colors
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-right "#[fg=brightblack]#h | %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=blue,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=yellow"

# list of tmux tmux-plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Persist sessions across restarts
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
