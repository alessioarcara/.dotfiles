# CLI tools for every machine, installed per user without sudo: `mise install`.
# A version prefix resolves to the newest matching release ("0.12" -> 0.12.x),
# so bug fixes arrive with `mise upgrade` but new majors/minors need an edit here.
[tools]
neovim = "0.12"
tree-sitter = "0.27"  # nvim-treesitter builds parsers with it
node = "24"           # mason LSP servers
tmux = "3.7c"         # prebuilt: the servers' distro tmux is too old for .tmux.conf
lazygit = "0.66"
lazydocker = "0.25"
delta = "0.20"
ripgrep = "15"
fd = "10"
fzf = "0.74"
zoxide = "0.10"
bat = "0.26"          # file previews in fzf (Ctrl-T)
atuin = "18"          # shell history search on Ctrl-R, optionally synced across machines
