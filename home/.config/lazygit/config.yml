customCommands:
  - key: "C"
    context: "files"
    description: "Create new conventional commit"
    prompts:
      - type: "menu"
        key: "type"
        title: "Select the type of change that you're committing"
        options:
          - name: "✨ feat      A new feature"
            value: "feat"
            key: "f"
          - name: "\U0001F41B fix       A bug fix"
            value: "fix"
            key: "x"
          - name: "\U0001F4DD docs      Documentation only changes"
            value: "docs"
            key: "d"
          - name: "\U0001F484 style     Changes that do not affect the meaning of the code"
            value: "style"
            key: "s"
          - name: "♻️ refactor  A code change that neither fixes a bug nor adds a feature"
            value: "refactor"
            key: "r"
          - name: "⚡️ perf      A code change that improves performance"
            value: "perf"
            key: "p"
          - name: "✅ test      Adding missing tests or correcting existing tests"
            value: "test"
            key: "t"
          - name: "\U0001F477 build     Changes that affect the build system or external dependencies"
            value: "build"
            key: "b"
          - name: "\U0001F3A1 ci        Changes to CI configuration files and scripts"
            value: "ci"
            key: "i"
          - name: "\U0001F528 chore     Other changes that don't modify src or test files"
            value: "chore"
            key: "c"
          - name: "⏪ revert    Reverts a previous commit"
            value: "revert"
            key: "v"
      - type: "menu"
        key: "hasScope"
        title: "What is the scope of this change (e.g. component or file name)"
        options:
          - name: "none"
            value: "no"
            key: "n"
          - name: "specify"
            value: "yes"
            key: "y"
      - type: "input"
        title: "What is the scope of this change (e.g. component or file name)"
        key: "scope"
        condition: '{{ eq .Form.hasScope "yes" }}'
      - type: "input"
        title: "Write a short, imperative tense description of the change"
        key: "subject"
      - type: "input"
        title: "Provide a longer description of the change"
        key: "body"
      - type: "menu"
        key: "isBreaking"
        title: "Are there any breaking changes?"
        options:
          - name: "no"
            value: "no"
            key: "n"
          - name: "yes"
            value: "!"
            key: "y"
      - type: "input"
        title: "A BREAKING CHANGE commit requires a body. Please enter a longer description of the commit itself"
        key: "body"
        condition: '{{ and (eq .Form.isBreaking "!") (not .Form.body) }}'
      - type: "input"
        title: "Describe the breaking changes"
        key: "breaking"
        condition: '{{ eq .Form.isBreaking "!" }}'
      - type: "menu"
        key: "hasIssue"
        title: "Does this change affect any open issues?"
        options:
          - name: "no"
            value: "no"
            key: "n"
          - name: "yes"
            value: "yes"
            key: "y"
      - type: "input"
        title: 'Add issue references (e.g. "fix #123", "re #123".)'
        key: "issue"
        condition: '{{ eq .Form.hasIssue "yes" }}'
    command: 'git commit --message ''{{.Form.type}}{{ if .Form.scope }}({{ .Form.scope }}){{ end }}{{ if eq .Form.isBreaking "!" }}!{{ end }}: {{.Form.subject}}'' {{ if .Form.body }}--message ''{{ .Form.body }}''{{ end }}{{ if .Form.breaking }} --message ''BREAKING CHANGE: {{.Form.breaking}}''{{ end }}{{ if .Form.issue }} --message ''{{.Form.issue}}''{{ end }}'
    loadingText: "Creating conventional commit..."
  - key: "A"
    context: "files"
    description: "AI conventional commit (Claude Code)"
    command: "~/.config/lazygit/ai-commit.sh"
    output: terminal
os:
  editPreset: "nvim"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
